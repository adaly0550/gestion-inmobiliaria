<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Iniciar Sesión - Gestión Inmobiliaria</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>

  <div class="login-box">
    <h2>Sistema de Inmobiliaria</h2>
    <p style="text-align: center; color: #666; font-size: 14px;">
      Inicia sesión para ingresar a tu panel según tu rol (RNF-01 / RN-09).
    </p>

    <div id="mensaje-login" class="alert"></div>

    <form id="form-login">
      <div class="form-group" style="margin-bottom: 14px;">
        <label for="usuario">Usuario</label>
        <input type="text" id="usuario" placeholder="Ej. admin o carlos" required>
      </div>

      <div class="form-group" style="margin-bottom: 18px;">
        <label for="password">Contraseña</label>
        <input type="password" id="password" placeholder="Ingresa tu contraseña" required>
      </div>

      <button type="submit" class="btn btn-primary" style="width: 100%;">Ingresar</button>
    </form>

    <div class="demo-users">
      <strong>Usuarios de prueba disponibles:</strong><br>
      <div style="margin-top: 6px;">
        <button type="button" class="demo-btn" onclick="llenarLogin('admin', 'admin123')">
          Administrador (admin)
        </button>
        <button type="button" class="demo-btn" onclick="llenarLogin('carlos', 'carlos123')">
          Carlos Asesor (carlos)
        </button>
        <button type="button" class="demo-btn" onclick="llenarLogin('laura', 'laura123')">
          Laura Asesora (laura)
        </button>
      </div>
    </div>
  </div>

  <script src="login.js"></script>
</body>
</html>
