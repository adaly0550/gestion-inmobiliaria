# ===================================================================
# CONFIGURACIÓN DE SPRING BOOT - SISTEMA DE GESTIÓN INMOBILIARIA
# ===================================================================
# Puerto 3000 e IPv4/IPv6 activos para evitar rechazos ERR_NGROK_8012 ([::1]:3000 vs 127.0.0.1:3000)
server.port=${PORT:3000}
server.address=0.0.0.0

# Cookie de sesión segura (Punto 8: httpOnly + SameSite Lax, sin confiar en headers del cliente)
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
server.servlet.session.cookie.name=INMOBILIARIA_SESSION
server.servlet.session.timeout=8h

# ===================================================================
# BASE DE DATOS POR DEFECTO: H2 PERSISTENTE EN ARCHIVO (COMPATIBLE CON MYSQL)
# Funciona de inmediato al clonar el repositorio sin requerir instalar MySQL
# ===================================================================
spring.datasource.url=jdbc:h2:file:./data/inmobiliaria_db;MODE=MySQL;DATABASE_TO_LOWER=TRUE;AUTO_SERVER=TRUE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# Consola H2 opcional para inspección en http://localhost:3000/h2-console
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# ===================================================================
# OPCIÓN ALTERNATIVA: MYSQL (Descomentar estas 4 líneas para usar MySQL local)
# ===================================================================
# spring.datasource.url=jdbc:mysql://localhost:3306/inmobiliaria?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
# spring.datasource.driverClassName=com.mysql.cj.jdbc.Driver
# spring.datasource.username=root
# spring.datasource.password=tu_password_aqui

# Configuración de Spring Data JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

# Evitar caché obsoleto en recursos estáticos del navegador / túnel ngrok
spring.web.resources.cache.cachecontrol.no-store=true
